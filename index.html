<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Interactive IT architecture atlas of a fictional veterinary clinic chain" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Network Atlas</title>
    <script>
      // Apply the stored theme before the first paint (no flash). Same key as src/hooks/useLocalStorage.ts.
      try {
        var t = JSON.parse(localStorage.getItem('atlas:theme'));
        if (t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
